[project]
name = "myproject"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ShristiSemantic", email = "shristi@semantic.dev" }
]
requires-python = ">=3.12"
dependencies = [
    "django>=6.1",
    "django-filter>=26.2",
    "djangorestframework>=3.18.1",
    "drf-spectacular>=0.30.0",
    "google-genai>=2.29.0",
    "pillow>=12.3.0",
    "psycopg>=3.3.6",
    "python-dotenv>=1.2.4",
]

[project.scripts]
myproject = "myproject:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_test.py", "tests.py"]